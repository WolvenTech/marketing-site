name: Publish image

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute image tags
        id: tags
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        # ghcr.io repository paths must be all-lowercase or the push rejects client-side,
        # even though the GitHub org itself is WolvenTech (mixed case). Do not "fix" this.
        run: |
          docker build \
            -t ghcr.io/wolventech/marketing-site:sha-${{ steps.tags.outputs.short_sha }} \
            -t ghcr.io/wolventech/marketing-site:sha-${{ steps.tags.outputs.full_sha }} \
            .

      - name: Push image
        run: |
          docker push ghcr.io/wolventech/marketing-site:sha-${{ steps.tags.outputs.short_sha }}
          docker push ghcr.io/wolventech/marketing-site:sha-${{ steps.tags.outputs.full_sha }}

      - name: Write job summary
        run: |
          {
            echo "## Published image"
            echo ""
            echo "Pin the \`wolven-prod\` deployment repo to:"
            echo ""
            echo '```'
            echo "ghcr.io/wolventech/marketing-site:sha-${{ steps.tags.outputs.short_sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
